    <style>
      /* screens.md S1: one card per row on phones, 2~3 columns on wider screens */
      .board { list-style: none; padding: 0; display: grid; gap: 1rem; }
      @media (min-width: 720px) { .board { grid-template-columns: repeat(auto-fill, minmax(22rem, 1fr)); } }
      fieldset label { display: block; }
    </style>
