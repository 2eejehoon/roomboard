# T108, research R3: production deploy. Run by hand from main (Actions → deploy → Run workflow); the production environment's
# required reviewer approves each run, and its secrets are separate from preview's.
name: deploy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      NAME: roomboard
    steps:
      - env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          [ "$HAS_TOKEN" = true ] || { echo "::error::Environment production에 CLOUDFLARE_API_TOKEN가 없습니다."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list --json > d1.json
          id=$(jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' d1.json)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$NAME" >/dev/null
            id=$(npx wrangler d1 list --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid')
          fi
          [ -n "$id" ] || { echo "::error::D1 $NAME의 id를 찾지 못했습니다."; exit 1; }
          # The Vite plugin builds the deploy config from this file, so the D1 id goes in before the build.
          node -e '
            const fs = require("node:fs");
            const c = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            c.d1_databases[0].database_id = process.argv[1];
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(c, null, 2));
          ' "$id"
      - env:
          VITE_TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
        run: |
          [ -n "$VITE_TURNSTILE_SITEKEY" ] || { echo "::error::Environment production에 TURNSTILE_SITEKEY가 없습니다."; exit 1; }
          npm run build
          npm run check:bundle
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          set -o pipefail
          for k in ADMIN_TOKEN SERVER_SECRET TURNSTILE_SECRET; do
            [ -n "${!k}" ] || { echo "::error::Environment production에 $k가 없습니다."; exit 1; }
          done
          trap 'rm -f "$RUNNER_TEMP/secrets.json"' EXIT
          # Migrate the live DB only once the build and the bundle check have passed, right before the new Worker goes out (PR #54 review).
          npx wrangler d1 migrations apply "$NAME" --remote
          jq -n '{ADMIN_TOKEN: env.ADMIN_TOKEN, SERVER_SECRET: env.SERVER_SECRET, TURNSTILE_SECRET: env.TURNSTILE_SECRET}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          [ -n "$url" ] || { echo "::error::배포 출력에서 workers.dev URL을 찾지 못했습니다."; exit 1; }
          echo "운영: $url (커밋 ${GITHUB_SHA:0:7})" >> "$GITHUB_STEP_SUMMARY"
