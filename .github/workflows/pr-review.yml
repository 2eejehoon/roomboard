name: pr-review
# 002 US7: independent review in a fresh session. Fails ai-review on blocking findings (FR-063).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
  id-token: write
concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ai-review:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft) ||
      (github.event_name == 'pull_request_target' && github.event.label.name == 'review:run' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same-repo PRs: normal checkout. Fork PRs: base at root, untrusted head only in pr-head/ (never executed).
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-head
          persist-credentials: false
      - id: claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: claude,claude[bot]
          prompt: |
            Repository: ${{ github.repository }}. Review pull request #${{ github.event.pull_request.number }}.
            Follow .claude/skills/pr-review/SKILL.md exactly.${{ github.event_name == 'pull_request_target' && ' The PR files are in pr-head/.' || '' }}
          claude_args: |
            --model opus
            --max-turns 40
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","required":["blocking","suggestions","summary"],"properties":{"blocking":{"type":"integer","minimum":0},"suggestions":{"type":"integer","minimum":0},"summary":{"type":"string"}}}'
            ${{ github.event_name == 'pull_request_target' && '--add-dir pr-head' || '' }}
      - name: No review result
        if: steps.claude.outputs.structured_output == ''
        run: |
          echo "::error::리뷰 에이전트가 결과를 내지 못했습니다(이 PR이 리뷰 워크플로 자체를 바꿨거나, 사용량 예산 소진, 실행 오류). 사람이 판단하세요."
          exit 1
      - name: Verdict
        if: steps.claude.outputs.structured_output != ''
        env:
          BLOCKING: ${{ fromJSON(steps.claude.outputs.structured_output).blocking }}
          SUMMARY: ${{ fromJSON(steps.claude.outputs.structured_output).summary }}
        run: |
          echo "$SUMMARY"
          if [ "$BLOCKING" -gt 0 ]; then echo "::error::차단 지적 $BLOCKING건. 리뷰 댓글을 확인하세요."; exit 1; fi
