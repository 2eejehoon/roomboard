name: preview
# research R3 (T097): every PR gets its own Worker and D1, roomboard-pr-<number>; the URL goes on the PR.
# pull_request, never its _target variant (that would run PR code with secrets): fork PRs get no secrets and skip. Fix-agent branches (agent/*) skip too: their code
# comes from an issue (constitution VII) and must not run next to the Cloudflare token.
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  deploy:
    if: ${{ !startsWith(github.head_ref, 'agent/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NAME: roomboard-pr-${{ github.event.pull_request.number }}
    steps:
      - id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = true ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN 없음: 미리보기 배포를 건너뜁니다(README Secrets)."; fi
      - if: steps.gate.outputs.run
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.run
        run: npm ci
      # The token is only in the wrangler steps, not in npm ci or the build.
      - if: steps.gate.outputs.run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 list --json > d1.json
          id=$(jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid' d1.json)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$NAME" >/dev/null
            id=$(npx wrangler d1 list --json | jq -r --arg n "$NAME" '.[] | select(.name == $n) | .uuid')
          fi
          # This checkout only: the Worker and D1 names of this PR (the Vite plugin builds its deploy config from this file).
          node -e '
            const fs = require("node:fs");
            const c = JSON.parse(fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, ""));
            c.name = process.env.NAME;
            c.d1_databases[0].database_name = process.env.NAME;
            c.d1_databases[0].database_id = process.argv[1];
            fs.writeFileSync("wrangler.jsonc", JSON.stringify(c, null, 2));
          ' "$id"
          npx wrangler d1 migrations apply "$NAME" --remote
      - if: steps.gate.outputs.run
        env:
          VITE_TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
        run: npm run build
      - if: steps.gate.outputs.run
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          jq -n '{ADMIN_TOKEN: env.ADMIN_TOKEN, SERVER_SECRET: env.SERVER_SECRET, TURNSTILE_SECRET: env.TURNSTILE_SECRET}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          rm "$RUNNER_TEMP/secrets.json"
          echo "url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.deploy.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.deploy.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --create-if-none --body "미리보기: $URL (커밋 ${SHA:0:7}). 휴대폰으로 quickstart Q1·Q3·Q8을 확인하세요."
