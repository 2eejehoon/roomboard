name: merge-gate
# FR-066: fails on the fix agent's PRs (agent/ branches), which a human merges. pull_request_target runs this file and
# scripts/merge-gate.mjs from the default branch, so a PR cannot weaken its own gate. PR code is never run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited] # edited: a base change must re-run the gate
permissions:
  contents: read
jobs:
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Human-merge PRs (scripts/merge-gate.mjs)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/merge-gate.mjs --head-ref "$HEAD_REF"
